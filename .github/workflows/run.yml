name: run
on:
  push:
    branches: [master]
  pull_request: {}
  workflow_dispatch: 
    inputs:
      org_or_user:
        description: 'The org (or user) to calculate total lines of code'
        required: false
        type: string
permissions:
  contents: read
env:
  # Fall back to the workflow token (public repos, authenticated rate limit)
  # when the ORG_GITHUB_TOKEN secret for private repos isn't configured.
  GITHUB_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN || github.token }}
jobs:
  run:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: 4.0

      - name: script/bootstrap
        run: script/bootstrap
      
      - name: rubocop
        run: bundle exec rubocop

      - name: count workflow dispatch
        if: github.event_name == 'workflow_dispatch'
        run: script/count ${{ inputs.org_or_user }}
      
      - name: default count
        if: github.event_name != 'workflow_dispatch'
        run: script/count balter-test-org